<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Dark circle background -->
  <circle cx="60" cy="60" r="60" fill="#1C0A00"/>

  <!-- Signal / steam arcs (WiFi-style, also read as steam) -->
  <!-- Outer arc — faintest -->
  <path d="M35 41 Q60 22 85 41"
        stroke="#C87941" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.35"/>
  <!-- Middle arc -->
  <path d="M41 38 Q60 23 79 38"
        stroke="#C87941" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.65"/>
  <!-- Inner arc — strongest -->
  <path d="M48 36 Q60 26 72 36"
        stroke="#C87941" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="1"/>
  <!-- Center dot (signal source / drip point) -->
  <circle cx="60" cy="39" r="2.5" fill="#C87941"/>

  <!-- Cup rim -->
  <rect x="22" y="47" width="66" height="7" rx="3.5" fill="#FEF3DC"/>

  <!-- Cup body (clean trapezoid) -->
  <path d="M26 54 L30 88 Q30 91 34 91 L86 91 Q90 91 90 88 L94 54 Z" fill="#FEF3DC"/>

  <!-- Handle -->
  <path d="M91 64 Q104 64 104 76 Q104 88 91 88"
        stroke="#FEF3DC" stroke-width="5.5" stroke-linecap="round" fill="none"/>

  <!-- Coffee surface (subtle) -->
  <ellipse cx="60" cy="57" rx="28" ry="4.5" fill="#C87941" opacity="0.4"/>
</svg>
