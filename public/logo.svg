<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="60" fill="#3D1C02"/>

  <!-- Steam wave 1 (left) -->
  <path d="M31 38 Q34.5 32 38 38" stroke="#C87941" stroke-width="2.5" stroke-linecap="round" fill="none" class="steam-1"/>
  <!-- Steam wave 2 (center) -->
  <path d="M45 34 Q49.5 27 54 34" stroke="#C87941" stroke-width="2.5" stroke-linecap="round" fill="none" class="steam-2"/>
  <!-- Steam wave 3 (right) -->
  <path d="M61 38 Q64.5 32 68 38" stroke="#C87941" stroke-width="2.5" stroke-linecap="round" fill="none" class="steam-3"/>

  <!-- Cup rim -->
  <rect x="22" y="45" width="60" height="8" rx="4" fill="#FEF3DC"/>

  <!-- Cup body (trapezoid) -->
  <path d="M26 53 L30 85 Q30 88 34 88 L80 88 Q84 88 84 85 L88 53 Z" fill="#FEF3DC"/>

  <!-- Handle -->
  <path d="M86 62 Q98 62 98 74 Q98 86 86 86"
        stroke="#FEF3DC" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Coffee surface inside cup -->
  <ellipse cx="57" cy="56" rx="25" ry="4" fill="#C87941" opacity="0.5"/>
  <ellipse cx="57" cy="56" rx="14" ry="2" fill="#E8A020" opacity="0.4"/>

  <!-- Coffee liquid fill -->
  <path d="M30 60 L29 85 Q29 88 33 88 L81 88 Q85 88 85 85 L84 60 Z" fill="#7A4118" opacity="0.25"/>
</svg>
