name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Conventional Commits types được phép
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # scope không bắt buộc — nhưng nếu có phải đúng format
          requireScope: false
          # subject (phần sau ":") tối đa 100 ký tự
          subjectPattern: ^.{1,100}$
          subjectPatternError: |
            PR title phải có subject (phần sau dấu ":"), tối đa 100 ký tự.
            Ví dụ: feat: thêm tính năng order realtime
