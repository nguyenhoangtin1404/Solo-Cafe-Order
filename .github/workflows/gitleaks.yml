name: GitLeaks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks-action@v2 scan scope (matches the old manual script behavior):
      #   pull_request → scans only commits in the PR (base..head)
      #   push (existing branch) → scans only new commits (before..after)
      #   push (new branch, before=0000…) → falls back to full-repo scan,
      #     same as the old script's "Branch mới tạo — scan toàn bộ repo" path.
      # .gitleaks.toml allowlist applies to all modes.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
